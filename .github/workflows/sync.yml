name: Sync official plugins

# New releases of HomeMaid's official plugins (with their entry.json) become a PR on index.json,
# checked like any other. Its PRs do not trigger the Check workflow (made with the workflow's
# token), so the check runs here first.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - name: Propose new versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp index.json base.json
          changes=$(python3 sync.py)
          if [ -z "$changes" ]; then echo "Nothing new"; exit 0; fi
          python3 check.py index.json --base base.json
          rm base.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C sync-official
          git commit -am "Official plugins: $(echo "$changes" | paste -sd ', ')"
          git push --force origin sync-official
          if [ -z "$(gh pr list --head sync-official --json number --jq '.[].number')" ]; then
            gh pr create --head sync-official --title "Official plugins: new versions" \
              --body "$(printf 'Released by HomeMaid'"'"'s release workflow, downloaded and checked (sha256, signature):\n\n%s\n' "$(echo "$changes" | sed 's/^/- /')")"
          fi
