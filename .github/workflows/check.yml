name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  index:
    name: index.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - name: Check index.json
        env:
          BASE: ${{ github.base_ref }}
          KEY_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'key-change') }}
        run: |
          args=()
          if [ -n "$BASE" ]; then
            git show "origin/$BASE:index.json" > base.json
            args+=(--base base.json)
          fi
          [ "$KEY_CHANGE" = true ] && args+=(--allow-key-change)
          python3 check.py index.json "${args[@]}"

  plugins:
    name: Plugins · clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The tests build the plugins to wasm themselves.
          targets: wasm32-wasip2
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --target wasm32-wasip2 -- -D warnings
      - run: cargo test

  template:
    name: Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Build the template as cargo generate would render it
        run: |
          cp -r template /tmp/demo-plugin
          cd /tmp/demo-plugin
          rm cargo-generate.toml
          sed -i 's/{{project-name}}/demo-plugin/g; s/{{plugin_id}}/demo/g' Cargo.toml src/lib.rs
          cargo build --release
          ls -l target/wasm32-wasip2/release/demo_plugin.wasm
