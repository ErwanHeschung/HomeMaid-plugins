[package]
name = "tplink-plugin"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
# cdylib: the plugin; rlib: lets its tests and examples reuse `klap` (a fake device, the probe).
crate-type = ["cdylib", "rlib"]

[dependencies]
aes = "0.9.3"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc"] }
getrandom = "0.4.3"
# The SDK at the plugin-api it is built for: bump the tag for a newer one.
homemaid-plugin = { git = "https://github.com/ErwanHeschung/HomeMaid", tag = "plugin-api-v1.2.0" }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"

# tests/device.rs: the plugin on a real hub (same tag) against a fake P300.
[dev-dependencies]
homemaid = { git = "https://github.com/ErwanHeschung/HomeMaid", tag = "plugin-api-v1.2.0" }
axum = "0.8.9"
jiff = "0.2.38"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "time"] }
toml = "1.1.8"
tracing-subscriber = "0.3.23"
