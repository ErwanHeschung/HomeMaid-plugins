[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The SDK, at the plugin-api your plugin is built for: bump the tag for a newer one.
homemaid-plugin = { git = "https://github.com/ErwanHeschung/HomeMaid", tag = "plugin-api-v1.2.0" }

[profile.release]
opt-level = "s"
lto = true
strip = true
